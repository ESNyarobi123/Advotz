services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: advo
      POSTGRES_USER: advo
      POSTGRES_PASSWORD: replace_for_your_environment
    ports:
      - "5432:5432"
    volumes:
      - advo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advo -d advo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    ports:
      - "6379:6379"
    volumes:
      - advo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  advo_pg_data:
  advo_redis_data:
