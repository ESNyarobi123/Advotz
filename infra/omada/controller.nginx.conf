# controller.advowifi.com — Advo WiFi Omada SDN Controller
#
# nginx terminates TLS here and forwards to the controller container's HTTPS
# port on 127.0.0.1:8043. Proxying the *HTTP* port would not work: the
# controller answers plain HTTP with a 302 to its own HTTPS port, which leaks
# `:8043` into the browser's address bar. The upstream certificate is the
# controller's self-signed one, so verification is off for that hop only; the
# browser sees the Let's Encrypt certificate below.
#
# ACME stays on port 80 so certbot can renew with --webroot and never needs to
# stop the proxy or touch the container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name controller.advowifi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Captive portal requests must reach the portal connector before authentication.
    location /portal/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_redirect off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name controller.advowifi.com;

    ssl_certificate     /etc/letsencrypt/live/controller.advowifi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/controller.advowifi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AdvoController:10m;
    ssl_session_timeout 1d;

    # Controller backups and firmware uploads travel through the UI.
    client_max_body_size 200m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The UI holds a long-poll connection; a short read timeout makes it look
    # disconnected while it is simply idle.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    # The management connector does not serve the captive portal routes.
    location /portal/ {
        proxy_pass https://127.0.0.1:8843;
        proxy_ssl_verify off;
        proxy_redirect off;
    }

    location / {
        proxy_pass https://127.0.0.1:8043;
        proxy_ssl_verify off;
        # Rewrite any absolute redirect that still names the internal port, so a
        # controller-generated URL never sends the browser to :8043.
        proxy_redirect ~^https?://[^/]+:8043/(.*)$ https://$host/$1;
        proxy_redirect ~^https?://[^/]+/(.*)$ https://$host/$1;
    }
}
