# Advo WiFi — Omada SDN Controller (controller.advowifi.com)
#
# Dedicated host: 139.84.231.0. nginx owns public 80/443. Management stays on
# 8043; portal HTTP binds container port 80 and is reached through loopback 8089.
# Keep the UI portal port and PORTAL_HTTP_PORT aligned; WEB_CONFIG_OVERRIDE
# reapplies these environment values on every container start.

name: omada-advo

services:
  controller:
    image: mbentley/omada-controller:6.3.0.111
    container_name: omada-advo-controller
    restart: unless-stopped
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    ports:
      # Plain HTTP management remains loopback-only; nginx uses HTTPS 8043.
      - "127.0.0.1:8088:8088"
      # nginx exposes the captive portal on public HTTP port 80.
      - "127.0.0.1:8089:80"
      # Published: devices use these for firmware upgrades and the built-in portal.
      - "8043:8043"
      - "8843:8843"
      - "8044:8044"
      # Discovery / adoption / management. An AP must be able to reach these.
      - "27001:27001/udp"
      - "29810:29810/udp"
      - "29811-29817:29811-29817"
    environment:
      MANAGE_HTTP_PORT: "8088"
      MANAGE_HTTPS_PORT: "8043"
      PORTAL_HTTP_PORT: "80"
      PORTAL_HTTPS_PORT: "8843"
      UPGRADE_HTTPS_PORT: "8043"
      UPGRADE_ES_HTTPS_PORT: "8044"
      PORT_APP_DISCOVERY: "27001"
      PORT_DISCOVERY: "29810"
      PORT_MANAGER_V1: "29811"
      PORT_ADOPT_V1: "29812"
      PORT_UPGRADE_V1: "29813"
      PORT_MANAGER_V2: "29814"
      PORT_TRANSFER_V2: "29815"
      PORT_RTTY: "29816"
      PORT_DEVICE_MONITOR: "29817"
      # Keep the ports above authoritative on every restart, not just the first.
      WEB_CONFIG_OVERRIDE: "true"
      JAVA_MIN_HEAP_SIZE: "512m"
      JAVA_MAX_HEAP_SIZE: "2048m"
      MONGOD_EXTRA_ARGS: "--wiredTigerCacheSizeGB 0.5"
      TZ: Africa/Dar_es_Salaam
      SHOW_SERVER_LOGS: "true"
      SHOW_MONGODB_LOGS: "false"
    volumes:
      - omada-data:/opt/tplink/EAPController/data
      - omada-logs:/opt/tplink/EAPController/logs
    healthcheck:
      # The image ships wget, not curl; the UI answers 200 on the HTTPS port.
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8043/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  omada-data:
  omada-logs:
